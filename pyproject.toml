[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex9-market-lab"
version = "0.1.0"
description = "Crypto market research, backtesting and paper-trading framework (simulation only, no real orders)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Federico Nicolas Baez Rizzo" }]
dependencies = [
    "ccxt>=4.3,<5",
    "numpy>=1.26,<2.4",
    "pandas>=2.1,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
market-lab = "cortex9_market_lab.cli:main"
cortex9-market-lab = "cortex9_market_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
